services:
  nsfw-guard:
    build: .
    image: nsfw-guard:dev
    network_mode: "none"
    # Systemd's nsfw-guard.service is responsible for restarting the
    # container — it runs `docker compose up` in the foreground and
    # Restart=always kicks in when the container exits.
    restart: "no"
    environment:
      - XDG_RUNTIME_DIR=/run/user/${UID}
      - XDG_CURRENT_DESKTOP=${XDG_CURRENT_DESKTOP}
      # ${VAR:-default} syntax: use VAR from .env if set, otherwise
      # fall back to the default after the colon.
      - MODEL_PATH=${MODEL_PATH:-/app/models/640m.onnx}
      - USE_GPU=${USE_GPU:-true}
      - IDLE_INTERVAL_S=${IDLE_INTERVAL_S:-0}
      - CONFIRM_FRAMES=${CONFIRM_FRAMES:-1}
      - ENTER_THRESHOLD=${ENTER_THRESHOLD:-0.45}
      - WARN_GRACE_S=${WARN_GRACE_S:-5.0}
      - GUARD_ACTIVE_START_HOUR=${GUARD_ACTIVE_START_HOUR:-22}
      - GUARD_ACTIVE_END_HOUR=${GUARD_ACTIVE_END_HOUR:-7}
      - WINDOW_CHECK_INTERVAL_S=${WINDOW_CHECK_INTERVAL_S:-30.0}
    volumes:
      - /run/user/${UID}/bus:/run/user/${UID}/bus
      - ${NSFW_GUARD_DATA_DIR}:/data
      - ./models:/app/models:ro
    # GPU passthrough (only relevant if USE_GPU=true, requires
    # nvidia-container-toolkit installed on the host — see README).
    # Remove this whole "deploy" block if you don't have an NVIDIA GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]